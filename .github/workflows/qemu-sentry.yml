name: QNX 8.0 Live QEMU Sentry

on:
  workflow_dispatch:

jobs:
  qemu-sentry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU x86_64 and host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 make
          python3 -m pip install -q gdown -e ".[dev]"

      - name: Download & install QNX SDP 8.0 headlessly
        env:
          MYQNX_USER: ${{ secrets.MYQNX_USER }}
          MYQNX_PASSWORD: ${{ secrets.MYQNX_PASSWORD }}
          MYQNX_LICENSE_KEY: ${{ secrets.MYQNX_LICENSE_KEY }}
          GDRIVE_ID: ${{ secrets.QNX_INSTALLER_GDRIVE_ID }}
        run: |
          gdown "$GDRIVE_ID" -O /tmp/qnx-setup.run
          chmod +x /tmp/qnx-setup.run
          /tmp/qnx-setup.run --noexec --target /tmp/qsc_extract
          CLT=/tmp/qsc_extract/qnxsoftwarecenter/qnxsoftwarecenter_clt
          "$CLT" -myqnx.user "$MYQNX_USER" -myqnx.password "$MYQNX_PASSWORD" -syncLicenseKeys
          if [ -n "$MYQNX_LICENSE_KEY" ]; then
            "$CLT" -myqnx.user "$MYQNX_USER" -myqnx.password "$MYQNX_PASSWORD" -activateLicenseKey "$MYQNX_LICENSE_KEY" || true
          fi
          "$CLT" -myqnx.user "$MYQNX_USER" -myqnx.password "$MYQNX_PASSWORD" -mirror
          for attempt in 1 2; do
            if "$CLT" -myqnx.user "$MYQNX_USER" -myqnx.password "$MYQNX_PASSWORD" \
              -installBaseline com.qnx.qnx800 -destination /tmp/qnx800 -cleanInstall; then
              break
            fi
            [ "$attempt" -eq 2 ] && exit 13
            echo "Retrying QNX SDP 8.0 install after transient timeout..."
            rm -rf /tmp/qnx800
            sleep 10
          done

      - name: Build secpol_sentry and boot QNX 8.0 QEMU TCG
        shell: bash
        run: |
          source /tmp/qnx800/qnxsdp-env.sh
          which qcc secpolcompile mkifs qemu-system-x86_64
          echo "COMMIT_SHA=${GITHUB_SHA}"
          qcc --version || true
          qemu-system-x86_64 --version | head -n 1
          make qemu-sentry

      - name: Build kprobe blast images and boot independent QNX 8.0 verification
        shell: bash
        run: |
          source /tmp/qnx800/qnxsdp-env.sh
          make qemu-blast
          set +e
          secpol-audit blast qnx_demo/mutants/M0_blast_clean.secpol \
            --ifs qnx_demo/build_blast.ifs.in \
            --log qnx_demo/build/blast/M0_blast_clean.log \
            --expected-probes-file qnx_demo/blast_expected_probes.json \
            --completeness-out qnx_demo/build/blast/M0_blast_completeness.json \
            --html qnx_demo/build/blast/M0_blast_explorer.html
          RC_M0=$?
          secpol-audit blast qnx_demo/mutants/M3_blast_escalate.secpol \
            --ifs qnx_demo/build_blast.ifs.in \
            --log qnx_demo/build/blast/M3_blast_escalate.log \
            --expected-probes-file qnx_demo/blast_expected_probes.json \
            --completeness-out qnx_demo/build/blast/M3_blast_completeness.json \
            --html qnx_demo/build/blast/M3_blast_explorer.html
          RC_M3=$?
          set -e
          [ "$RC_M0" -eq 0 ] || { echo "Expected exit 0 for M0_blast_clean, got $RC_M0"; exit 1; }
          [ "$RC_M3" -eq 1 ] || { echo "Expected exit 1 for M3_blast_escalate, got $RC_M3"; exit 1; }
          for f in \
            qnx_demo/build/blast/M0_blast_clean.log \
            qnx_demo/build/blast/M3_blast_escalate.log \
            qnx_demo/build/blast/M0_blast_completeness.json \
            qnx_demo/build/blast/M3_blast_completeness.json \
            qnx_demo/build/blast/M0_blast_explorer.html \
            qnx_demo/build/blast/M3_blast_explorer.html; do
            test -s "$f" || { echo "Missing or empty artifact: $f"; exit 1; }
          done
          python3 -c '
          import json
          for p in ("qnx_demo/build/blast/M0_blast_completeness.json", "qnx_demo/build/blast/M3_blast_completeness.json"):
              d = json.load(open(p))
              assert d["result"] == "COMPLETE", f"{p}: result={d['result']}"
              assert d["probes_total"] == 12, f"{p}: probes_total={d['probes_total']}"
              assert d["probes_completed"] == 12, f"{p}: probes_completed={d['probes_completed']}"
              assert d["kernel_events_correlated"] == 12, f"{p}: kernel_events_correlated={d['kernel_events_correlated']}"
              assert d["unobservable_operations"] == 0, f"{p}: unobservable_operations={d['unobservable_operations']}"
              assert d["mismatches"] == 0, f"{p}: mismatches={d['mismatches']}"
              assert d["dropped_events"] == 0, f"{p}: dropped_events={d['dropped_events']}"
          print("All blast completeness checks PASSED")
          '

      - name: Build & boot 12-type ADAS security policy model QNX 8.0 QEMU verification (16 probes + channel-type override)
        shell: bash
        run: |
          source /tmp/qnx800/qnxsdp-env.sh
          make qemu-adas-blast
          set +e
          secpol-audit blast qnx_demo/mutants/ADAS_12svc_blast.secpol \
            --ifs qnx_demo/build_adas_blast.ifs.in \
            --log qnx_demo/build/adas_blast/ADAS_12svc_blast.log \
            --expected-probes-file qnx_demo/adas_expected_probes.json \
            --completeness-out qnx_demo/build/adas_blast/ADAS_12svc_blast_completeness.json \
            --html qnx_demo/build/adas_blast/ADAS_12svc_blast_explorer.html
          RC_ADAS_VULN=$?
          secpol-audit blast qnx_demo/mutants/ADAS_12svc_fixed_blast.secpol \
            --ifs qnx_demo/build_adas_blast.ifs.in \
            --log qnx_demo/build/adas_blast/ADAS_12svc_fixed_blast.log \
            --expected-probes-file qnx_demo/adas_expected_probes.json \
            --completeness-out qnx_demo/build/adas_blast/ADAS_12svc_fixed_blast_completeness.json \
            --html qnx_demo/build/adas_blast/ADAS_12svc_fixed_blast_explorer.html
          RC_ADAS_FIXED=$?
          set -e
          [ "$RC_ADAS_VULN" -eq 1 ] || { echo "Expected exit 1 for ADAS_12svc_blast, got $RC_ADAS_VULN"; exit 1; }
          [ "$RC_ADAS_FIXED" -eq 0 ] || { echo "Expected exit 0 for ADAS_12svc_fixed_blast, got $RC_ADAS_FIXED"; exit 1; }
          python3 - << 'PY'
          import json
          for p in (
              "qnx_demo/build/adas_blast/ADAS_12svc_blast_completeness.json",
              "qnx_demo/build/adas_blast/ADAS_12svc_fixed_blast_completeness.json",
          ):
              d = json.load(open(p))
              assert d["result"] == "COMPLETE", f"{p}: result={d['result']}"
              assert d["probes_total"] == 16, f"{p}: probes_total={d['probes_total']}"
              assert d["probes_completed"] == 16, f"{p}: probes_completed={d['probes_completed']}"
              assert d["kernel_events_correlated"] == 16, f"{p}: kernel_events_correlated={d['kernel_events_correlated']}"
              assert d["unobservable_operations"] == 0, f"{p}: unobservable_operations={d['unobservable_operations']}"
              assert d["mismatches"] == 0, f"{p}: mismatches={d['mismatches']}"
              assert d["dropped_events"] == 0, f"{p}: dropped_events={d['dropped_events']}"
              assert d.get("kernel_policy_id", 0) > 0, f"{p}: missing/zero kernel_policy_id={d.get('kernel_policy_id')}"
          print("All 12-type ADAS security policy model 16/16 COMPLETE + kernel_policy_id checks PASSED")
          PY

      - name: Build secpolgen_capture.ifs and boot stock QNX 8.0 secpolgenerate capture
        shell: bash
        run: |
          source /tmp/qnx800/qnxsdp-env.sh
          make secpolgen-image
          mkdir -p qnx_demo/build/secpolgen
          bash harness/run_qemu.sh qnx_demo/build/secpolgen_capture.ifs qnx_demo/build/secpolgen/secpolgen_capture.log 60
          set +e
          python3 harness/extract_secpolgen.py qnx_demo/build/secpolgen/secpolgen_capture.log --out-dir qnx_demo/build/secpolgen
          RC_EXT=$?
          set -e
          [ "$RC_EXT" -eq 0 ] || [ "$RC_EXT" -eq 1 ] || { echo "extract_secpolgen.py failed with exit $RC_EXT"; exit "$RC_EXT"; }
          if [ -f qnx_demo/build/secpolgen/qnx8_generated.secpol ] && [ -f qnx_demo/build/secpolgen/qnx8_unused.txt ]; then
            set +e
            secpol-audit prune qnx_demo/build/secpolgen/qnx8_generated.secpol \
              --unused qnx_demo/build/secpolgen/qnx8_unused.txt \
              --errors qnx_demo/build/secpolgen/qnx8_errors.txt
            RC_PRUNE=$?
            set -e
            [ "$RC_PRUNE" -eq 0 ] || [ "$RC_PRUNE" -eq 1 ] || { echo "secpol-audit prune failed with exit $RC_PRUNE"; exit "$RC_PRUNE"; }
          fi

      - name: Inspect and verify real libsecpolev logs
        if: always()
        run: |
          for f in evidence/qemu_logs/M0_sentry_clean.log evidence/qemu_logs/M3_sentry_escalate.log qnx_demo/build/secpolgen/secpolgen_capture.log; do
            if [ -f "$f" ]; then
              echo "================ $f ================"
              cat "$f"
            fi
          done
          set +e
          secpol-audit verify-events qnx_demo/mutants/M3_sentry_escalate.secpol --log evidence/qemu_logs/M3_sentry_escalate.log
          RC_EV_M3=$?
          secpol-audit verify-events qnx_demo/mutants/M0_sentry_clean.secpol --log evidence/qemu_logs/M0_sentry_clean.log
          RC_EV_M0=$?
          set -e
          [ "$RC_EV_M3" -eq 1 ] || { echo "Expected exit 1 for M3_sentry_escalate verify-events, got $RC_EV_M3"; exit 1; }
          [ "$RC_EV_M0" -eq 0 ] || { echo "Expected exit 0 for M0_sentry_clean verify-events, got $RC_EV_M0"; exit 1; }

      - name: Upload real QNX 8.0 sentry logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnx8-sentry-qemu-logs-${{ github.sha }}
          path: |
            evidence/qemu_logs/M0_sentry_clean.log
            evidence/qemu_logs/M3_sentry_escalate.log
          if-no-files-found: warn

      - name: Upload real QNX 8.0 secpolgenerate capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnx8-secpolgen-capture-${{ github.sha }}
          path: |
            qnx_demo/build/secpolgen/secpolgen_capture.log
            qnx_demo/build/secpolgen/qnx8_generated.secpol
            qnx_demo/build/secpolgen/qnx8_unused.txt
            qnx_demo/build/secpolgen/qnx8_errors.txt
          if-no-files-found: warn

      - name: Upload real QNX 8.0 blast verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnx8-blast-qemu-logs-${{ github.sha }}
          path: |
            qnx_demo/build/blast/M0_blast_clean.log
            qnx_demo/build/blast/M3_blast_escalate.log
            qnx_demo/build/blast/M0_blast_completeness.json
            qnx_demo/build/blast/M3_blast_completeness.json
            qnx_demo/build/blast/M0_blast_explorer.html
            qnx_demo/build/blast/M3_blast_explorer.html
          if-no-files-found: warn

      - name: Upload real QNX 8.0 12-type ADAS security policy model blast verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnx8-adas-blast-qemu-logs-${{ github.sha }}
          path: |
            qnx_demo/build/adas_blast/ADAS_12svc_blast.log
            qnx_demo/build/adas_blast/ADAS_12svc_fixed_blast.log
            qnx_demo/build/adas_blast/ADAS_12svc_blast_completeness.json
            qnx_demo/build/adas_blast/ADAS_12svc_fixed_blast_completeness.json
            qnx_demo/build/adas_blast/ADAS_12svc_blast_explorer.html
            qnx_demo/build/adas_blast/ADAS_12svc_fixed_blast_explorer.html
          if-no-files-found: warn
